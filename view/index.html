  return parts.join('/');
}
async function show() {
  const path = decodeURIComponent(location.hash.slice(1));
  const main = document.getElementById('main');
  document.getElementById('path').textContent = path;
  document.title = path.split('/').pop() || 'Reference File';
  if (!path || path.includes('..')) { main.innerHTML = '<p class="note">No file selected.</p>'; return; }
  let text;
  try { const r = await fetch('../files/' + path.split('/').map(encodeURIComponent).join('/')); if (!r.ok) throw 0; text = await r.text(); }
  catch { main.innerHTML = '<p class="note">This file is not included in the public site.</p>'; return; }
  const ext = (path.match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase();
  if (ext === 'md') {
    main.innerHTML = marked.parse(text);
    for (const c of main.querySelectorAll('pre code')) hljs.highlightElement(c);
    for (const img of main.querySelectorAll('img[src]')) { const s = img.getAttribute('src'); if (!/^[a-z]+:|^\//i.test(s)) img.src = '../files/' + resolve(path, s); }
    for (const a of main.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href');
      if (/^[a-z]+:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
      if (href.startsWith('#')) continue;
      const [p, frag] = href.split('#');
      const target = resolve(path, decodeURIComponent(p)).replace(/\/+$/, '');
      const url = MAP[target] ?? MAP[target + '/'];
      if (url) a.setAttribute('href', '../' + url + (frag && url.includes('#/') ? '/' + frag : ''));
      else { const span = document.createElement('span'); span.append(...a.childNodes); a.replaceWith(span); }
    }
  } else {
    const lang = LANGS[ext];
    main.innerHTML = `<pre><code class="${lang ? 'language-' + lang : ''}">${esc(text)}</code></pre>`;
    if (lang && hljs.getLanguage(lang)) hljs.highlightElement(main.querySelector('code'));
  }
  scrollTo(0, 0);
}
addEventListener('hashchange', show);
show();
</script>
</body>
